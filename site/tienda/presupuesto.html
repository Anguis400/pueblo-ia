<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presupuesto de proyecto · Demo</title><style>body{font:16px/1.6 system-ui;background:#0d1d28;color:#edf5f4;max-width:1100px;margin:auto;padding:24px}a{color:#94eac3}article,details{background:#193440;border:1px solid #42616a;border-radius:14px;padding:20px;margin:16px 0}input,button{font:inherit;padding:10px;margin:8px}label{display:block}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}summary{cursor:pointer}small{color:#b9d0d4}</style><h1>Presupuesto de proyecto</h1><p>Estimar una propuesta sin enviarla. Demo local, sin envío de datos. Importes orientativos; revisa impuestos y supuestos.</p><form><label>Horas estimadas<input name="horas" type="number" min="0" step="any" value="0" required></label><label>Tarifa EUR por hora<input name="tarifa" type="number" min="0" step="any" value="0" required></label><label>Extras EUR<input name="extras" type="number" min="0" step="any" value="0" required></label><label>Impuesto %<input name="impuesto" type="number" min="0" step="any" value="21" required></label><button>Calcular</button></form><output aria-live="polite">Introduce tus datos.</output><p><a href="./">Catálogo</a></p><script>
const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);
function calculate(v){const base=v.horas*v.tarifa+v.extras;return 'Base: '+money(base)+' · Impuestos: '+money(base*v.impuesto/100)+' · Total: '+money(base*(1+v.impuesto/100));}
document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const v=Object.fromEntries([...new FormData(e.target)].map(([k,x])=>[k,Number(x)]));try{if(Object.values(v).some(x=>!Number.isFinite(x)||x<0))throw Error('Introduce valores válidos');document.querySelector('output').textContent=calculate(v)}catch(err){document.querySelector('output').textContent=err.message}});
</script></html>
