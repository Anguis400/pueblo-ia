<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escandallo de servicios · Demo</title><style>body{font:16px/1.6 system-ui;background:#0d1d28;color:#edf5f4;max-width:1100px;margin:auto;padding:24px}a{color:#94eac3}article,details{background:#193440;border:1px solid #42616a;border-radius:14px;padding:20px;margin:16px 0}input,button{font:inherit;padding:10px;margin:8px}label{display:block}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}summary{cursor:pointer}small{color:#b9d0d4}</style><h1>Escandallo de servicios</h1><p>Calcular coste y precio objetivo. Demo local, sin envío de datos. Importes orientativos; revisa impuestos y supuestos.</p><form><label>Coste directo EUR<input name="coste" type="number" min="0" step="any" value="0" required></label><label>Horas<input name="horas" type="number" min="0" step="any" value="0" required></label><label>Coste por hora EUR<input name="tarifa" type="number" min="0" step="any" value="0" required></label><label>Margen objetivo % (menor de 100)<input name="margen" type="number" min="0" step="any" value="30" required></label><button>Calcular</button></form><output aria-live="polite">Introduce tus datos.</output><p><a href="./">Catálogo</a></p><script>
const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);
function calculate(v){if(v.margen>=100)throw Error('El margen debe ser menor de 100');const coste=v.coste+v.horas*v.tarifa;return 'Coste: '+money(coste)+' · Precio objetivo sin impuestos: '+money(coste/(1-v.margen/100));}
document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const v=Object.fromEntries([...new FormData(e.target)].map(([k,x])=>[k,Number(x)]));try{if(Object.values(v).some(x=>!Number.isFinite(x)||x<0))throw Error('Introduce valores válidos');document.querySelector('output').textContent=calculate(v)}catch(err){document.querySelector('output').textContent=err.message}});
</script></html>
