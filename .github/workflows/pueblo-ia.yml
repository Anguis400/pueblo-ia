name: Pueblo IA - Radar y Panel

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Cuatro rondas diarias, cada 6 h; puede haber retrasos en GitHub Actions.
    - cron: '17 1,7,13,19 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'

permissions:
  contents: write

concurrency:
  group: pueblo-ia-production
  cancel-in-progress: false

jobs:
  scan:
    # Playwright 1.58 supports this LTS; avoid ubuntu-latest drifting to an unsupported OS.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node para pruebas de navegador
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Tests offline
        run: python -m unittest discover -s tests -v
      - name: Ejecutar agentes de investigación
        run: python -m app.run
      - name: Compilar interfaz desde evidencia guardada
        run: |
          python -m app.presentation
          python -m app.render
      - name: Validar sitio generado
        run: python -m unittest discover -s tests -v
      - name: Preparar navegador de pruebas
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Probar interacción y rutas de GitHub Pages
        run: npm run test:browser
      - name: Guardar actividad pública sin datos privados
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/
          if ! git diff --cached --quiet; then
            git commit -m "chore: registrar ejecucion del Pueblo IA"
            git push
          fi
      - name: Preparar GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Empaquetar sitio web
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: scan
    if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar panel
        id: deployment
        uses: actions/deploy-pages@v4
